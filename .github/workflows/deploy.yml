name: Deploy to Windows Server

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: campus-vehicle-production
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build and release
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build single jar with frontend
        run: |
          set -euo pipefail
          rm -rf backend/src/main/resources/static
          mkdir -p backend/src/main/resources/static
          cp -a frontend/dist/. backend/src/main/resources/static/
          cd backend
          mvn -B -DskipTests clean package
          ls -lh target/campus-vehicle.jar

      - name: Publish release asset
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="build-${GITHUB_RUN_ID}"
          gh release create "$TAG" backend/target/campus-vehicle.jar \
            --title "Build ${GITHUB_SHA::7}" \
            --notes "Automated build from ${GITHUB_SHA}" \
            --latest
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Download and restart on server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          APP_PORT: ${{ secrets.APP_PORT }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "powershell -NoProfile -ExecutionPolicy Bypass -Command \"New-Item -ItemType Directory -Force -Path '$DEPLOY_PATH' | Out-Null; Invoke-WebRequest -UseBasicParsing -Uri 'https://raw.githubusercontent.com/jy111704/menjin/$GITHUB_SHA/deploy/windows-deploy.ps1' -OutFile '$DEPLOY_PATH/windows-deploy.ps1'; & '$DEPLOY_PATH/windows-deploy.ps1' -AppDir '$DEPLOY_PATH' -Port $APP_PORT -ReleaseTag '$RELEASE_TAG'\""
