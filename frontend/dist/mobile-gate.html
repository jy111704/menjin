<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#eef2f7">
  <title>手机门岗 · 校园车辆出入登记</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    [hidden] { display: none !important; }
    body {
      margin: 0;
      background: #eef2f7;
      color: #0f172a;
      font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .app { max-width: 520px; margin: 0 auto; padding: 18px 14px 32px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    .eyebrow { font-size: 11px; letter-spacing: .08em; color: #64748b; }
    h1 { margin: 2px 0 0; font-size: 22px; font-weight: 700; letter-spacing: -.02em; }
    h2 { margin: 0; font-size: 16px; font-weight: 650; }
    .card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, .04);
    }
    .hint { margin: 4px 0 0; font-size: 12px; line-height: 1.5; color: #64748b; }
    label { display: block; font-size: 13px; font-weight: 600; color: #334155; }
    label input, label select {
      display: block;
      width: 100%;
      height: 48px;
      margin-top: 7px;
      padding: 0 13px;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      background: #fff;
      color: #0f172a;
      font: inherit;
      font-size: 16px;
      outline: none;
    }
    label input:focus, label select:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, .12); }
    .card > label + label { margin-top: 12px; }
    button {
      width: 100%;
      min-height: 48px;
      border: 0;
      border-radius: 12px;
      font: inherit;
      font-size: 15px;
      font-weight: 650;
      cursor: pointer;
    }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .primary { margin-top: 14px; background: #1d4ed8; color: #fff; }
    .primary:active { background: #1e40af; }
    .primary.big { min-height: 56px; font-size: 17px; }
    .ghost { background: #f1f5f9; color: #0f172a; }
    .ghost.small { width: auto; min-height: 36px; padding: 0 12px; font-size: 12px; border-radius: 10px; }
    .gate-row { display: flex; align-items: flex-end; gap: 10px; }
    .grow { flex: 1; }
    .camera-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .badge {
      flex: none;
      padding: 5px 9px;
      border-radius: 999px;
      background: #f1f5f9;
      color: #475569;
      font-size: 11px;
      font-weight: 650;
      white-space: nowrap;
    }
    .badge.ok { background: #dcfce7; color: #166534; }
    .badge.warn { background: #fef3c7; color: #92400e; }
    .video-wrap {
      position: relative;
      margin-top: 12px;
      border-radius: 14px;
      overflow: hidden;
      background: #0f172a;
      aspect-ratio: 4 / 3;
    }
    video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .scan-frame {
      position: absolute;
      left: 10%;
      right: 10%;
      top: 30%;
      bottom: 30%;
      border: 2px solid #38bdf8;
      border-radius: 10px;
      box-shadow: 0 0 0 999px rgba(15, 23, 42, .18);
      pointer-events: none;
    }
    .shot { width: 100%; max-height: 48vh; object-fit: contain; margin-top: 12px; border-radius: 14px; background: #0f172a; }
    .camera-actions { display: grid; gap: 8px; margin-top: 12px; }
    .camera-actions button { margin-top: 0; }
    .plate-label { margin-top: 2px; }
    .plate-input {
      height: 62px !important;
      margin-top: 8px !important;
      padding: 0 10px !important;
      border-radius: 14px !important;
      border: 2px solid #cbd5e1 !important;
      text-align: center;
      font-size: 28px !important;
      font-weight: 750 !important;
      letter-spacing: .12em;
    }
    .plate-input:focus { border-color: #1d4ed8 !important; }
    .msg { min-height: 20px; margin-top: 9px; font-size: 13px; line-height: 1.5; color: #64748b; }
    .msg.error { color: #b91c1c; }
    .msg.ok { color: #15803d; }
    .result {
      margin-top: 4px;
      padding: 18px 16px 16px;
      border: 1px solid #86efac;
      border-radius: 16px;
      background: #ecfdf5;
    }
    .result.fail { border-color: #fca5a5; background: #fef2f2; }
    .result-title { font-size: 32px; font-weight: 800; letter-spacing: -.03em; color: #15803d; }
    .result.fail .result-title { color: #b91c1c; }
    .result-msg { margin-top: 4px; font-size: 14px; line-height: 1.5; color: #166534; }
    .result.fail .result-msg { color: #991b1b; }
    .details { display: grid; grid-template-columns: 76px 1fr; gap: 8px 10px; margin: 14px 0 0; }
    .details dt { font-size: 12px; color: #64748b; }
    .details dd { margin: 0; font-size: 13px; font-weight: 600; color: #0f172a; word-break: break-all; }
    .result .ghost { margin-top: 16px; }
    .foot { margin-top: 18px; text-align: center; font-size: 11px; color: #94a3b8; }
    @media (min-width: 700px) { .app { padding-top: 28px; } }
  </style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div>
      <div class="eyebrow">校园车辆出入登记</div>
      <h1>手机门岗</h1>
    </div>
    <button id="logoutBtn" class="ghost small" hidden>退出</button>
  </header>

  <section id="loginCard" class="card">
    <h2>门岗登录</h2>
    <p class="hint">使用保卫处分配的门卫或管理员账号</p>
    <label>账号
      <input id="username" autocomplete="username" placeholder="请输入账号">
    </label>
    <label>密码
      <input id="password" type="password" autocomplete="current-password" placeholder="请输入密码">
    </label>
    <button id="loginBtn" class="primary">登录</button>
    <div id="loginMsg" class="msg"></div>
  </section>

  <main id="gateApp" hidden>
    <section class="card gate-row">
      <label class="grow">当前门岗
        <select id="gateSelect"></select>
      </label>
      <button id="refreshGates" class="ghost small">刷新</button>
    </section>

    <section class="card camera-card">
      <div class="camera-head">
        <div>
          <h2>扫描车牌</h2>
          <p id="cameraHint" class="hint">HTTP 下用系统相机拍照；HTTPS 下可实时预览。</p>
        </div>
        <span id="secureBadge" class="badge">检测中</span>
      </div>
      <div id="videoWrap" class="video-wrap" hidden>
        <video id="video" autoplay playsinline muted></video>
        <div class="scan-frame"></div>
      </div>
      <img id="shot" class="shot" alt="待识别车牌照片" hidden>
      <div class="camera-actions">
        <button id="liveBtn" class="primary" hidden>开启实时预览</button>
        <button id="captureLiveBtn" class="primary" hidden>抓拍识别</button>
        <button id="photoBtn" class="primary">拍照识别</button>
      </div>
      <input id="fileInput" type="file" accept="image/*" capture="environment" hidden>
      <div id="ocrMsg" class="msg"></div>
    </section>

    <section class="card">
      <label class="plate-label">车牌号（可手动修正）
        <input id="plateInput" class="plate-input" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="粤A12345" maxlength="8">
      </label>
      <button id="verifyBtn" class="primary big">确认核验</button>
      <div id="verifyMsg" class="msg"></div>
    </section>

    <section id="resultCard" class="result" hidden>
      <div id="resultTitle" class="result-title">已放行</div>
      <div id="resultMsg" class="result-msg"></div>
      <dl id="resultDetails" class="details"></dl>
      <button id="nextBtn" class="ghost">下一辆</button>
    </section>
  </main>

  <footer class="foot">校园车辆出入登记管理系统 · 手机门岗</footer>
</div>

<script>
(function () {
  'use strict';

  var API = '/api';
  var TOKEN_KEY = 'cv_token';
  var USER_KEY = 'cv_user';

  var token = localStorage.getItem(TOKEN_KEY) || '';
  var stream = null;
  var shotUrl = null;
  var audioCtx = null;

  function $(id) { return document.getElementById(id); }

  function setMsg(id, text, type) {
    var el = $(id);
    el.textContent = text || '';
    el.className = 'msg' + (type ? ' ' + type : '');
  }

  function normalizePlate(value) {
    return (value || '').toUpperCase().replace(/[\s\-·•.]/g, '');
  }

  async function api(path, options) {
    options = options || {};
    var headers = new Headers(options.headers || {});
    if (token) headers.set('Authorization', 'Bearer ' + token);
    var body = options.body;
    if (body && !(body instanceof FormData) && typeof body !== 'string') {
      body = JSON.stringify(body);
    }
    if (body && !(body instanceof FormData)) {
      headers.set('Content-Type', 'application/json');
    }
    var res = await fetch(API + path, {
      method: options.method || 'GET',
      headers: headers,
      body: body
    });
    var data = null;
    try { data = await res.json(); } catch (e) { data = null; }
    if (res.status === 401) {
      logout();
      throw new Error('登录已失效，请重新登录');
    }
    if (!res.ok) {
      throw new Error((data && data.msg) || ('请求失败 HTTP ' + res.status));
    }
    if (data && data.code !== 0) {
      throw new Error(data.msg || '操作失败');
    }
    return data ? data.data : null;
  }

  function showLogin() {
    $('loginCard').hidden = false;
    $('gateApp').hidden = true;
    $('logoutBtn').hidden = true;
    stopCamera();
  }

  function showApp() {
    $('loginCard').hidden = true;
    $('gateApp').hidden = false;
    $('logoutBtn').hidden = false;
  }

  function logout() {
    token = '';
    localStorage.removeItem(TOKEN_KEY);
    localStorage.removeItem(USER_KEY);
    showLogin();
    setMsg('loginMsg', '已退出登录', '');
  }

  async function login() {
    var username = $('username').value.trim();
    var password = $('password').value;
    if (!username || !password) {
      setMsg('loginMsg', '请输入账号和密码', 'error');
      return;
    }
    $('loginBtn').disabled = true;
    setMsg('loginMsg', '登录中…', '');
    try {
      var data = await api('/auth/login', {
        method: 'POST',
        body: { username: username, password: password }
      });
      token = data.token;
      localStorage.setItem(TOKEN_KEY, token);
      localStorage.setItem(USER_KEY, JSON.stringify(data.user || {}));
      $('password').value = '';
      setMsg('loginMsg', '', '');
      showApp();
      await loadGates();
    } catch (e) {
      setMsg('loginMsg', e.message, 'error');
    } finally {
      $('loginBtn').disabled = false;
    }
  }

  async function loadGates() {
    try {
      var gates = await api('/verify/gates');
      var select = $('gateSelect');
      select.innerHTML = '';
      if (!gates || !gates.length) {
        var empty = document.createElement('option');
        empty.value = '';
        empty.textContent = '暂无启用门岗';
        select.appendChild(empty);
        return;
      }
      gates.forEach(function (gate) {
        var option = document.createElement('option');
        option.value = String(gate.id);
        var direction = gate.direction === 'IN' ? '入口' : gate.direction === 'OUT' ? '出口' : '双向';
        option.textContent = gate.gateName + '（' + direction + '）';
        select.appendChild(option);
      });
    } catch (e) {
      setMsg('verifyMsg', e.message, 'error');
    }
  }

  function secureCameraSupported() {
    return !!(window.isSecureContext && navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
  }

  function updateCameraMode() {
    var secure = secureCameraSupported();
    var badge = $('secureBadge');
    badge.textContent = secure ? 'HTTPS 实时模式' : 'HTTP 拍照模式';
    badge.className = 'badge ' + (secure ? 'ok' : 'warn');
    $('liveBtn').hidden = !secure;
    $('photoBtn').hidden = false;
    $('cameraHint').textContent = secure
      ? '可开启实时预览，对准车牌后抓拍。'
      : '当前是 HTTP，点击“拍照识别”会调系统相机；要实时预览请用 HTTPS。';
  }

  async function startCamera() {
    if (!secureCameraSupported()) {
      setMsg('ocrMsg', '当前不是 HTTPS，无法实时预览；请直接用“拍照识别”。', 'error');
      return;
    }
    $('liveBtn').disabled = true;
    setMsg('ocrMsg', '正在打开摄像头…', '');
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
        audio: false
      });
      $('video').srcObject = stream;
      $('videoWrap').hidden = false;
      $('shot').hidden = true;
      $('liveBtn').hidden = true;
      $('captureLiveBtn').hidden = false;
      await $('video').play();
      setMsg('ocrMsg', '对准车牌后点“抓拍识别”', '');
    } catch (e) {
      setMsg('ocrMsg', '摄像头打开失败：' + e.message + '；可改用“拍照识别”。', 'error');
      $('liveBtn').hidden = false;
    } finally {
      $('liveBtn').disabled = false;
    }
  }

  function stopCamera() {
    if (stream) {
      stream.getTracks().forEach(function (track) { track.stop(); });
      stream = null;
    }
    $('video').srcObject = null;
    $('videoWrap').hidden = true;
    $('captureLiveBtn').hidden = true;
    $('liveBtn').hidden = !secureCameraSupported();
  }

  function loadImage(blob) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(blob);
      var img = new Image();
      img.onload = function () {
        URL.revokeObjectURL(url);
        resolve(img);
      };
      img.onerror = function (e) {
        URL.revokeObjectURL(url);
        reject(new Error('图片读取失败'));
      };
      img.src = url;
    });
  }

  async function compressImage(blob) {
    var img = await loadImage(blob);
    var maxSide = 1600;
    var width = img.naturalWidth || img.width;
    var height = img.naturalHeight || img.height;
    if (Math.max(width, height) > maxSide) {
      var scale = maxSide / Math.max(width, height);
      width = Math.round(width * scale);
      height = Math.round(height * scale);
    }
    var canvas = document.createElement('canvas');
    canvas.width = width;
    canvas.height = height;
    canvas.getContext('2d').drawImage(img, 0, 0, width, height);
    return await new Promise(function (resolve) {
      canvas.toBlob(function (result) { resolve(result); }, 'image/jpeg', 0.85);
    });
  }

  function showShot(blob) {
    if (shotUrl) URL.revokeObjectURL(shotUrl);
    shotUrl = URL.createObjectURL(blob);
    $('shot').src = shotUrl;
    $('shot').hidden = false;
    $('videoWrap').hidden = true;
  }

  async function recognize(blob) {
    showShot(blob);
    $('photoBtn').disabled = true;
    $('captureLiveBtn').disabled = true;
    setMsg('ocrMsg', '识别中，请稍候…', '');
    try {
      var form = new FormData();
      form.append('file', blob, 'plate.jpg');
      var data = await api('/ocr/plate', { method: 'POST', body: form });
      $('plateInput').value = data.plateNo || '';
      setMsg('ocrMsg', '识别成功：' + data.plateNo + '（置信度 ' + data.confidence + '）', 'ok');
      if (navigator.vibrate) navigator.vibrate(50);
      beep(true);
    } catch (e) {
      setMsg('ocrMsg', e.message + '。可直接手动输入车牌。', 'error');
      $('plateInput').focus();
    } finally {
      $('photoBtn').disabled = false;
      $('captureLiveBtn').disabled = false;
    }
  }

  async function onFileChange(event) {
    var file = event.target.files && event.target.files[0];
    event.target.value = '';
    if (!file) return;
    try {
      var blob = await compressImage(file);
      await recognize(blob);
    } catch (e) {
      setMsg('ocrMsg', e.message, 'error');
    }
  }

  async function captureLive() {
    var video = $('video');
    if (!video.videoWidth) {
      setMsg('ocrMsg', '摄像头还没准备好，请稍等', 'error');
      return;
    }
    var canvas = document.createElement('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
    canvas.toBlob(function (blob) {
      if (!blob) {
        setMsg('ocrMsg', '抓拍失败，请重试', 'error');
        return;
      }
      recognize(blob);
    }, 'image/jpeg', 0.9);
  }

  function beep(ok) {
    try {
      if (!audioCtx) {
        var Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        audioCtx = new Ctx();
      }
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = ok ? 880 : 220;
      gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.18);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.2);
    } catch (e) { /* ignore */ }
  }

  function directionText(direction) {
    return direction === 'IN' ? '入场' : direction === 'OUT' ? '离场' : (direction || '-');
  }

  function showResult(result) {
    var card = $('resultCard');
    card.hidden = false;
    card.className = 'result' + (result.pass ? '' : ' fail');
    $('resultTitle').textContent = result.pass ? '放行' : '拦截';
    $('resultMsg').textContent = result.message || (result.pass ? '核验通过' : '核验未通过');

    var rows = [
      ['车牌', result.plateNo || '-'],
      ['方向', directionText(result.direction)],
      ['类型', result.passType === 'INTERNAL' ? '校内车辆' : result.passType === 'VISITOR' ? '访客车辆' : '-'],
      ['姓名', result.holderName || '-'],
      ['通行码', result.passNo || '-'],
      ['门岗', result.gateName || '-'],
      ['时间', result.occurTime || '-'],
      ['剩余', result.remainMinutes == null ? '-' : (result.remainMinutes >= 0 ? result.remainMinutes + ' 分钟' : '已过期')]
    ];
    var dl = $('resultDetails');
    dl.innerHTML = '';
    rows.forEach(function (row) {
      var dt = document.createElement('dt');
      dt.textContent = row[0];
      var dd = document.createElement('dd');
      dd.textContent = row[1];
      dl.appendChild(dt);
      dl.appendChild(dd);
    });

    beep(result.pass);
    if (navigator.vibrate) navigator.vibrate(result.pass ? [60, 40, 60] : [200, 80, 200]);
    card.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  async function verify() {
    var plate = normalizePlate($('plateInput').value);
    $('plateInput').value = plate;
    if (!plate) {
      setMsg('verifyMsg', '请先拍照识别或手动输入车牌', 'error');
      return;
    }
    var gateId = $('gateSelect').value ? Number($('gateSelect').value) : null;
    $('verifyBtn').disabled = true;
    setMsg('verifyMsg', '核验中…', '');
    try {
      var result = await api('/verify', {
        method: 'POST',
        body: { plateNo: plate, gateId: gateId }
      });
      setMsg('verifyMsg', '', '');
      showResult(result);
    } catch (e) {
      setMsg('verifyMsg', e.message, 'error');
      $('resultCard').hidden = true;
      beep(false);
      if (navigator.vibrate) navigator.vibrate(200);
    } finally {
      $('verifyBtn').disabled = false;
    }
  }

  function nextVehicle() {
    $('resultCard').hidden = true;
    $('plateInput').value = '';
    $('shot').hidden = true;
    if (shotUrl) {
      URL.revokeObjectURL(shotUrl);
      shotUrl = null;
    }
    setMsg('ocrMsg', '', '');
    setMsg('verifyMsg', '', '');
    if (stream) {
      $('videoWrap').hidden = false;
      $('liveBtn').hidden = true;
      $('captureLiveBtn').hidden = false;
    } else {
      $('liveBtn').hidden = !secureCameraSupported();
    }
    $('plateInput').focus();
  }

  async function init() {
    $('loginBtn').addEventListener('click', login);
    $('password').addEventListener('keydown', function (e) { if (e.key === 'Enter') login(); });
    $('logoutBtn').addEventListener('click', logout);
    $('refreshGates').addEventListener('click', loadGates);
    $('liveBtn').addEventListener('click', startCamera);
    $('captureLiveBtn').addEventListener('click', captureLive);
    $('photoBtn').addEventListener('click', function () { $('fileInput').click(); });
    $('fileInput').addEventListener('change', onFileChange);
    $('verifyBtn').addEventListener('click', verify);
    $('plateInput').addEventListener('keydown', function (e) { if (e.key === 'Enter') verify(); });
    $('nextBtn').addEventListener('click', nextVehicle);

    updateCameraMode();

    if (!token) {
      showLogin();
      return;
    }
    try {
      await api('/auth/me');
      showApp();
      await loadGates();
    } catch (e) {
      showLogin();
    }
  }

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) stopCamera();
  });
  window.addEventListener('beforeunload', stopCamera);

  init();
})();
</script>
</body>
</html>
